# Publishes the web player as a static page on GitHub Pages: open or drop an .lvd (read in place,
# never uploaded), or pass ?src=<url> of one served with range requests. Exports render in the
# browser. Needs Settings → Pages → Source: GitHub Actions.
name: Pages

on:
  push:
    branches: [main]
    paths: ['player/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: player/package-lock.json
      - run: npm ci && npm run typecheck && npx vite build --outDir dist
        working-directory: player
      - uses: actions/upload-pages-artifact@v3
        with:
          path: player/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
