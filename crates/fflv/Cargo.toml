[package]
name = "fflv"
description = "Pack, edit, decode, render and view LVF layered video files (.lvd)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "fflv"
path = "src/lib.rs"

[[bin]]
name = "fflv"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
include_dir = "0.7"
lvf = { path = "../lvf" }
png = "0.17"
rayon = "1.10"
serde_json.workspace = true
tiny_http = "0.12"
vpx-sys = { path = "../vpx-sys" }

[lints]
workspace = true
