[package]
name = "fflv-python"
description = "Python bindings of fflv (the `fflv._fflv` extension module)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "_fflv"
crate-type = ["cdylib"]
# tested from Python (tests/), not with cargo
test = false
doctest = false

[dependencies]
fflv = { path = "../fflv" }
lvf = { path = "../lvf" }
numpy = "0.29"
pyo3 = { version = "0.29", features = ["abi3-py39"] }
serde_json.workspace = true

[lints]
workspace = true
