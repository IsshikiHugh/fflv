[workspace]
resolver = "2"
members = ["crates/lvf", "crates/vpx-sys", "crates/fflv", "crates/fflv-python"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
rust-version = "1.83"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[workspace.lints.clippy]
# Encoder/edit entry points take many plain parameters on purpose; the clap command enum is
# built once.
too_many_arguments = "allow"
type_complexity = "allow"
large_enum_variant = "allow"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev.package."*"]
opt-level = 2
