[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "fflv"
description = "LVF layered video (.lvd): pack, edit, decode, render and view — a small ffmpeg-like toolkit for debugging with layers"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["numpy>=1.21"]
dynamic = ["version"]
keywords = ["video", "layers", "vp9", "debugging", "visualization"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "Topic :: Multimedia :: Video",
]

[project.urls]
Homepage = "https://github.com/IsshikiHugh/fflv"
Changelog = "https://github.com/IsshikiHugh/fflv/blob/main/CHANGELOG.md"
Specification = "https://github.com/IsshikiHugh/fflv/blob/main/LVF_SPEC.md"

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
fflv = "fflv.cli:entry"

[tool.maturin]
manifest-path = "crates/fflv-python/Cargo.toml"
python-source = "python"
module-name = "fflv._fflv"
features = ["pyo3/extension-module"]
# the built player (not tracked; release.yml builds it first): the sdist builds without Node
include = [{ path = "crates/fflv/viewer/**/*", format = "sdist" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
