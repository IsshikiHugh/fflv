[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "fflv"
description = "LVF layered video (.lvd): pack, edit, decode, render and view — a small ffmpeg-like toolkit for debugging with layers"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.21"]
dynamic = ["version"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
fflv = "fflv.cli:entry"

[tool.maturin]
manifest-path = "crates/fflv-python/Cargo.toml"
python-source = "python"
module-name = "fflv._fflv"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
